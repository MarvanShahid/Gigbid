name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: lint + repo rules (no secrets, gigsim/ untouched, prompts only in agent/prompts, numbers cite results)
        run: make lint PY=python
      - name: unit, integration, contract (schema snapshot) tests
        run: python -m pytest
        env: { GIGBID_PROFILE: rules, GIGBID_EMBEDDER: hashed-tfidf, GIGBID_RERANKER: lexical }
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e .
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx next build && npx playwright test
        working-directory: apps/web
        env: { PYTHON: python, PW_CHANNEL: chromium, GIGBID_EMBEDDER: hashed-tfidf, GIGBID_RERANKER: lexical }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/web/playwright-report }
