name: eval-gate
on: [pull_request]
jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: 30-job smoke eval (fails if unsupported claims rise or bid/skip F1 drops past evals/thresholds.yaml)
        run: python -m evals.runners.smoke_eval
        env: { GIGBID_EMBEDDER: hashed-tfidf, GIGBID_RERANKER: lexical }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-eval, path: evals/results/smoke.json }
