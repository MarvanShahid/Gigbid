[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: multi-agent freelancer copilot (AI-4016 Assignment II, Marvan Shahid 23i-0800)"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.22",
  "langgraph-checkpoint-postgres==3.2.1",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langgraph-supervisor==0.0.31",
  "langchain-core==1.8.0",
  "langchain-openai==1.8.0",
  "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0",
  "fastapi==0.163.1",
  "uvicorn[standard]==0.54.0",
  "sse-starlette==3.7.0",
  "python-multipart==0.0.33",
  "pydantic==2.14.3",
  "email-validator==2.4.0",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "sqlalchemy==2.1.8",
  "psycopg[binary]==3.3.9",
  "psycopg-pool>=3.2",
  "pgvector==0.5.1",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "rank-bm25==0.2.2",
  "fastembed==0.9.1",
  "pypdf==7.1.0",
  "reportlab==5.1.0",
  "celery[redis]==5.7.0",
  "redis==8.1.0",
  "cryptography==50.0.2",
  "bcrypt==5.0.0",
  "pyjwt==2.15.1",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "rag*", "mcp_servers*", "apps*", "worker*", "sim*", "evals*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "E702", "E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests", "mcp_servers"]
asyncio_mode = "auto"
addopts = "-q -p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"
